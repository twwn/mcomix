body:
  - type: markdown
    attributes:
      value: |
        An idea for MComix, to talk over before it becomes a feature request.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What MComix should do, and when you would use it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround or another program, if any.
