# Keeps the actions the workflows use at their current major version:
# an action left behind runs on a Node the runners are dropping, and
# says so in every run's log.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release a week old or more: a compromised one is usually found
    # and pulled within days, before it would be proposed here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
