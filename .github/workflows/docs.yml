name: Manual

# The manual's own checks, for a push or pull request that changes the
# manual and nothing tests.yml tests: test/test_wiki.py (links, anchors,
# and what the pages say of the code, the packages and the workflows)
# and test/test_keybindings.py (the keys and buttons docs/shortcuts.md
# lists).  tests.yml leaves such a change alone and runs these two with
# the rest for any other; a push that changes both runs both.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash runs with -o pipefail, which the runner's default
# bash -e leaves out.
defaults:
  run:
    shell: bash

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    # As the gates in tests.yml: the newest Ubuntu's GTK 4, which the
    # pages' claims about the menus and keys are read against.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      # What PyGObject builds against, and a display for the GTK the
      # tests import.
      - name: Install GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgirepository-2.0-dev \
            libcairo2-dev pkg-config xvfb xauth
      - name: Install MComix and pytest
        run: python -m pip install -e '.[dev]'
      - name: pytest
        run: xvfb-run -a python -m pytest test/test_wiki.py test/test_keybindings.py -q -n auto -rs
