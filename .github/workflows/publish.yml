name: Publish

# Puts a published release out to the package managers: called
# by release.yml once it has published one, run by GitHub when a release
# is published by hand, or run by hand, given the tag.  Each job runs in
# a GitHub environment of its own, which holds its secret: no other job
# can read it, and the environment's rules can hold the job for approval
# and limit it to release tags.  A job whose secret is not set does
# nothing but say so.
#
#   Chocolatey  the package mcomix-gtk, which downloads the release's MSI.
#               Environment chocolatey, secret CHOCOLATEY_API_KEY: an
#               API key of the account win32/mcomix.nuspec names as its
#               owner.
#   winget      a pull request to microsoft/winget-pkgs.  Environment
#               winget, secret WINGET_TOKEN: a classic token with
#               public_repo, of the account whose fork of
#               microsoft/winget-pkgs the pull request comes from: the
#               repository variable WINGET_FORK_USER, the repository's
#               owner where it is not set.  The package has to be there
#               once before this can update it: submit the first version
#               by hand, with "komac new" or "wingetcreate new".  The
#               identifier is the repository variable WINGET_IDENTIFIER,
#               twwn.MComix where it is not set.
#
# Flathub needs nothing here: its own checker reads the x-checker-data
# of the manifest's MComix source, and opens the pull request for a new
# tag itself.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "The published release to put out"
        required: true
        type: string
    secrets:
      CHOCOLATEY_API_KEY:
        required: false
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release to put out, such as 26.09"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  chocolatey:
    runs-on: windows-2025
    environment: chocolatey
    timeout-minutes: 15
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Without an API key there is nothing to push
        if: env.CHOCOLATEY_API_KEY == ''
        run: echo "::notice::CHOCOLATEY_API_KEY is not set; the Chocolatey package was not pushed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHOCOLATEY_API_KEY != ''
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      # The package downloads the installer from the release, so the
      # checksum it checks is taken from that very file; the release's
      # name goes beside it, as win32/build_msi.py writes both.
      - name: Record the release's installer
        if: env.CHOCOLATEY_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "mcomix-win64-$env:TAG.msi" --dir dist
          (Get-FileHash "dist/mcomix-win64-$env:TAG.msi" -Algorithm SHA256).Hash.ToLower() | Set-Content win32/tools/checksum.sha256
          $env:TAG | Set-Content win32/tools/release.txt
      - name: Pack and push mcomix-gtk
        if: env.CHOCOLATEY_API_KEY != ''
        run: |
          choco pack win32/mcomix.nuspec --version $env:TAG --out dist
          $package = Get-ChildItem dist -Filter 'mcomix-gtk.*.nupkg' | Select-Object -First 1
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

  winget:
    runs-on: windows-2025
    environment: winget
    timeout-minutes: 15
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Without a token there is nothing to submit
        if: env.WINGET_TOKEN == ''
        shell: pwsh
        run: echo "::notice::WINGET_TOKEN is not set; no winget pull request was opened."
      # Handed a token: like every action here it runs the commit it is
      # pinned to, which only a pull request of Dependabot's moves.
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER || 'twwn.MComix' }}
          release-tag: ${{ env.TAG }}
          installers-regex: '\.msi$'
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}
          token: ${{ env.WINGET_TOKEN }}

