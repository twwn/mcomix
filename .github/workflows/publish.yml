name: Publish

# Puts a published release out to the package managers: called
# by release.yml once it has published one, run by GitHub when a release
# is published by hand, or run by hand, given the tag.  Each job does
# nothing but say why where its secret is not set.
#
#   Chocolatey  the package mcomix-gtk, which downloads the release's MSI.
#               Secret CHOCOLATEY_API_KEY: an API key of the account
#               win32/mcomix.nuspec names as its owner.
#   winget      a pull request to microsoft/winget-pkgs.  Secret
#               WINGET_TOKEN: a classic token with public_repo, of an
#               account with a fork of microsoft/winget-pkgs.  The
#               package has to be there once before this can update it:
#               submit the first version by hand, with
#               "komac new" or "wingetcreate new".  The identifier is the
#               repository variable WINGET_IDENTIFIER, twwn.MComix where
#               it is not set.
#   Flathub     a pull request to flathub/io.github.twwn.mcomix that
#               moves its manifest to the tag.  Secret FLATHUB_TOKEN: a
#               token that can push branches to that repository and open
#               pull requests on it.  The repository exists only once the
#               app has been accepted: submit it the first time by hand,
#               as flathub.org's submission guide says, with the manifest
#               "python3 flatpak/flathub_manifest.py <tag> <commit>"
#               writes.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "The published release to put out"
        required: true
        type: string
    secrets:
      CHOCOLATEY_API_KEY:
        required: false
      WINGET_TOKEN:
        required: false
      FLATHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release to put out, such as 26.09"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  chocolatey:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Without an API key there is nothing to push
        if: env.CHOCOLATEY_API_KEY == ''
        run: echo "::notice::CHOCOLATEY_API_KEY is not set; the Chocolatey package was not pushed."
      - uses: actions/checkout@v7
        if: env.CHOCOLATEY_API_KEY != ''
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      # The package downloads the installer from the release, so the
      # checksum it checks is taken from that very file; the release's
      # name goes beside it, as win32/build_msi.py writes both.
      - name: Record the release's installer
        if: env.CHOCOLATEY_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "mcomix-win64-$env:TAG.msi" --dir dist
          (Get-FileHash "dist/mcomix-win64-$env:TAG.msi" -Algorithm SHA256).Hash.ToLower() | Set-Content win32/tools/checksum.sha256
          $env:TAG | Set-Content win32/tools/release.txt
      - name: Pack and push mcomix-gtk
        if: env.CHOCOLATEY_API_KEY != ''
        run: |
          choco pack win32/mcomix.nuspec --version $env:TAG --out dist
          $package = Get-ChildItem dist -Filter 'mcomix-gtk.*.nupkg' | Select-Object -First 1
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

  winget:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Without a token there is nothing to submit
        if: env.WINGET_TOKEN == ''
        shell: pwsh
        run: echo "::notice::WINGET_TOKEN is not set; no winget pull request was opened."
      # Pinned to a commit, as it is handed a token; Dependabot moves the
      # pin along with the action's releases.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER || 'twwn.MComix' }}
          release-tag: ${{ env.TAG }}
          installers-regex: '\.msi$'
          token: ${{ env.WINGET_TOKEN }}

  flathub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - name: Without a token there is nothing to submit
        if: env.FLATHUB_TOKEN == ''
        run: echo "::notice::FLATHUB_TOKEN is not set; no Flathub pull request was opened."
      - uses: actions/checkout@v7
        if: env.FLATHUB_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Open the pull request that moves Flathub to the tag
        if: env.FLATHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          python3 flatpak/flathub_manifest.py "$TAG" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/io.github.twwn.mcomix.yml"
          git clone "https://x-access-token:${FLATHUB_TOKEN}@github.com/flathub/io.github.twwn.mcomix.git" "$RUNNER_TEMP/flathub"
          cd "$RUNNER_TEMP/flathub"
          git switch -c "update-$TAG"
          cp "$RUNNER_TEMP/io.github.twwn.mcomix.yml" io.github.twwn.mcomix.yml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "Update to $TAG"
          git push origin "update-$TAG"
          gh pr create --repo flathub/io.github.twwn.mcomix --head "update-$TAG" \
            --title "Update to $TAG" \
            --body "MComix $TAG: https://github.com/twwn/mcomix/releases/tag/$TAG"
