name: Windows tests

# The suite on Windows, in MSYS2's UCRT64 environment - the GTK 4,
# Python and PyGObject the Windows packages are built from.  The Linux
# gates cannot see a bug that only Windows has, such as the one about
# loading libunrar from the directory MComix starts in.
#
# On every push to main and every pull request, as tests.yml, and by
# hand: a run takes about six and a half minutes, two of them setting
# up MSYS2 when its cache below misses.  A pull request is mostly
# Dependabot's, moving the actions this workflow runs too.  A change
# to the manual alone is left to docs.yml, which checks the manual on
# Linux.

on:
  push:
    branches: [main]
    paths-ignore:
      - "artwork/**"
      - "docs/**"
      - "*.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "artwork/**"
      - "docs/**"
      - "*.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The installed MSYS2 tree is kept for a week, under a key that
      # also changes with this file and so with the package list: the
      # system update, the downloads and the install took two minutes a
      # run.  The tests may then run on packages up to a week old;
      # release.yml installs the newest every time, and its Monday test
      # build shows what a newer package breaks.
      - name: The week, for the MSYS2 cache
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore MSYS2
        id: msys2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\msys64
          key: msys2-ucrt64-${{ hashFiles('.github/workflows/windows-tests.yml') }}-${{ steps.week.outputs.week }}
      # The packages release.yml builds with, pytest, and jxrlib, whose
      # JxrEncApp and JxrDecApp the tests of a KFX book's JPEG XR
      # pictures write and read them with.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.msys2-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-jxrlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pymupdf
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-pytest-xdist
            mingw-w64-ucrt-x86_64-gettext-tools
      - name: Keep MSYS2
        if: steps.msys2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\msys64
          key: ${{ steps.msys2-cache.outputs.cache-primary-key }}
      # UnRAR64.dll, which the Windows packages carry and MComix.exe
      # loads: without it every test of the RAR handlers was skipped
      # here.  A download that fails leaves them skipped, as before,
      # rather than failing the run.
      - name: Fetch UnRAR.dll
        shell: pwsh
        continue-on-error: true
        run: |
          $unrar = ./win32/fetch_unrar.ps1 -Destination "$env:RUNNER_TEMP\unrar"
          "The tests load UnRAR.dll $unrar." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      # From PowerShell, with UCRT64's programs, UnRAR64.dll and the
      # runner's 7-Zip on the path and nothing else of MSYS2's, and
      # without MSYSTEM, which makes MSYS2's Python write paths with "/":
      # MComix.exe runs that way, started from Explorer.  setup-msys2 sets
      # MSYSTEM for every step after it, this one included, so it is
      # taken out here.  The tree restored from the cache is the same
      # one, at the same place.
      - name: pytest
        shell: pwsh
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:RUNNER_TEMP\unrar;$env:PATH;$env:ProgramFiles\7-Zip"
          python -c "import os, sys; print(sys.executable, repr(os.sep), sorted(k for k in os.environ if k.upper().startswith(('MSYS', 'MINGW')))); assert os.sep == '\\'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest test/ -q -n auto -rfEs --durations=30 --junitxml=pytest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest
          path: pytest.xml
          retention-days: 14
