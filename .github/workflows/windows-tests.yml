name: Windows tests

# The suite on Windows, in MSYS2's UCRT64 environment - the GTK 4,
# Python and PyGObject the Windows packages are built from.  The Linux
# gates cannot see a bug that only Windows has, such as the one about
# loading libunrar from the directory MComix starts in.
#
# Started by hand only, until a first run shows how much of the suite
# holds on Windows: tests written against a POSIX file system or an X
# server may need skipping there before this can run on every push.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The packages release.yml builds with, and pytest.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pymupdf
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-pytest-xdist
            mingw-w64-ucrt-x86_64-gettext-tools
      # From PowerShell, with UCRT64's programs and the runner's 7-Zip on
      # the path and nothing else of MSYS2's, and without MSYSTEM, which
      # makes MSYS2's Python write paths with "/": MComix.exe runs that
      # way, started from Explorer.  setup-msys2 sets MSYSTEM for every
      # step after it, this one included, so it is taken out here.
      - name: pytest
        shell: pwsh
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH;$env:ProgramFiles\7-Zip"
          python -c "import os, sys; print(sys.executable, repr(os.sep), sorted(k for k in os.environ if k.upper().startswith(('MSYS', 'MINGW')))); assert os.sep == '\\'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest test/ -q -n auto -rfE --durations=30 --junitxml=pytest.xml
      # Window tests take 11-14 s each in the run above and under 1.5 s
      # each in a process of their own; the IME crash fix (985506cf) did
      # not change that.  One whole file in one process, one line per
      # test: the runner's timestamps on those lines say whether a test
      # gets slower the more tests its process has run.
      - name: one file in one process
        if: always()
        timeout-minutes: 30
        shell: pwsh
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH;$env:ProgramFiles\7-Zip"
          python -m pytest -v -p no:xdist --durations=15 test/test_main_window.py
      # A file chooser built in a single process warned twice from GTK's
      # places sidebar: g_filename_to_uri() of a NULL Desktop folder.  The
      # tests point USERPROFILE at a home with no Desktop in it; whether
      # that is what makes GLib find none.
      - name: the Desktop folder GLib finds
        if: always()
        shell: pwsh
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH"
          $home_dir = (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\desktop-probe").FullName
          $env:USERPROFILE = $home_dir
          $env:HOME = $home_dir
          python -c "from gi.repository import GLib; print('no Desktop folder:', GLib.get_user_special_dir(GLib.UserDirectory.DIRECTORY_DESKTOP))"
          New-Item -ItemType Directory -Path "$home_dir\Desktop" | Out-Null
          python -c "from gi.repository import GLib; print('a Desktop folder:', GLib.get_user_special_dir(GLib.UserDirectory.DIRECTORY_DESKTOP))"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest
          path: pytest.xml
          retention-days: 14
