name: Release

# Builds the source archive, the Windows zip and installer, and the
# Flatpak bundle.
#
# From a tag - pushed, or chosen under "Use workflow from" when run by
# hand - it is a release: the tag has to be VERSION in
# mcomix/constants.py, the built MComix has to start, and then the
# GitHub release is published with the files, their checksums
# and build provenance, and the tag's ChangeLog.md section as its notes;
# then publish.yml puts it out to Chocolatey and winget, and the pypi job
# to PyPI.  The
# Flatpak is built alongside, and attached where it built; a release
# goes out without it rather than not at all.  A draft release
# of the tag is replaced; a published one is left alone, and has to be
# deleted by hand (keeping the tag) before the tag can be released again.
#
# From a branch - every Monday, on a push to main or a pull request
# that touches the build, or by hand - it builds the same files and
# keeps them as the run's artifacts: a build to try, and the early
# warning that MSYS2 or a download has moved under the build before a
# release finds out.  Changes to the build reach main as pushes, not
# pull requests, so the paths below are watched on both; GitHub does
# not apply them to a pushed tag, which always builds.

on:
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9]"
      - "[0-9][0-9].[0-9][0-9].[0-9]*"
    branches: [main]
    paths:
      - "win32/**"
      - "flatpak/**"
      - "tools/source_archive.py"
      - "mcomixstarter.py"
      - "pyproject.toml"
      - ".github/requirements/release.txt"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "win32/**"
      - "flatpak/**"
      - "tools/source_archive.py"
      - "mcomixstarter.py"
      - "pyproject.toml"
      - ".github/requirements/release.txt"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 5 * * 1"
  # Every job checks out the commit the run was started on, and nothing
  # else: a ref handed in from outside, and built with the rights of the
  # default branch, is what CodeQL calls cache poisoning.
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash runs with -o pipefail, which the runner's default
# bash -e leaves out: a failed command at the head of a pipe went
# unnoticed when what it fed succeeded.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: What to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.what.outputs.version }}
      release: ${{ steps.what.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A release, or a test build
        id: what
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'$/\1/p" mcomix/constants.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A test build of MComix $version at ${GITHUB_SHA::8}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG, but mcomix/constants.py says $version"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: The release's section of ChangeLog.md
        if: steps.what.outputs.release == 'true'
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          awk -v heading="# MComix $VERSION" '
            $0 == heading { found = 1; next }
            found && /^# MComix / { exit }
            found' ChangeLog.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::ChangeLog.md has no section headed \"# MComix $VERSION\""
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.what.outputs.release == 'true'
        with:
          name: notes
          path: notes.md

  source:
    name: Source archive
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # build and twine, and what they need, at the versions and with the
      # hashes .github/requirements/release.txt names: what makes the
      # files PyPI is handed is pinned as the actions are.
      - run: |
          python -m pip install --require-hashes -r .github/requirements/release.txt
          python tools/source_archive.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/mcomix-*.tar.xz
          if-no-files-found: error
          retention-days: ${{ needs.setup.outputs.release == 'true' && 30 || 14 }}
      # What PyPI takes: the sdist as .tar.gz, named as Python's
      # packaging normalises the version, and a wheel.
      - run: python -m build --outdir pypi
      # What PyPI would refuse, found here rather than by the first upload,
      # which cannot be taken back: metadata it does not take, a README
      # it cannot render.  And a wheel short of a file Git has under
      # mcomix/ - a picture, a compiled catalogue - which would install a
      # MComix that fails when it reaches for it.  The catalogues'
      # sources, the .po files and the template, are not packaged
      # (MANIFEST.in takes the .mo files alone), and are left out of
      # the comparison.
      - name: Check the sdist and the wheel
        run: |
          python -m twine check --strict pypi/mcomix-*
          git ls-files mcomix | grep -v -E '\.pot?$' | sort > tracked.txt
          python -m zipfile -l pypi/mcomix-*.whl | awk 'NR > 1 && $1 ~ /^mcomix\// { print $1 }' | sort > packed.txt
          if missing=$(comm -23 tracked.txt packed.txt) && [ -n "$missing" ]; then
            echo "::error::The wheel leaves out files of mcomix/:"
            echo "$missing"
            exit 1
          fi
          echo "The wheel carries all $(wc -l < tracked.txt) files Git has under mcomix/."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi
          path: pypi/mcomix-*
          if-no-files-found: error
          retention-days: ${{ needs.setup.outputs.release == 'true' && 30 || 14 }}

  windows:
    name: Windows packages
    needs: setup
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The packages docs/releasing.md lists, at MSYS2's newest; the path
      # is inherited so that WiX, fetched below, is found.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-jxrlib
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-pymupdf
            mingw-w64-ucrt-x86_64-pyinstaller
      # 7-Zip is the runner's, which its image keeps current; UnRAR.dll
      # is RARLAB's newest release, as win32/fetch_unrar.ps1 finds it.
      - name: Fetch 7-Zip and UnRAR.dll into ../mcomix-other
        shell: pwsh
        run: |
          $sevenzip = "$env:ProgramFiles/7-Zip/7z.exe"
          $other = Join-Path (Split-Path $PWD) 'mcomix-other'
          New-Item -ItemType Directory -Force "$other/7z" | Out-Null
          Copy-Item "$env:ProgramFiles/7-Zip/7z.exe", "$env:ProgramFiles/7-Zip/7z.dll", "$env:ProgramFiles/7-Zip/License.txt" "$other/7z"
          $unrar = ./win32/fetch_unrar.ps1 -Destination "$other/unrar" -SevenZip $sevenzip
          $sevenzipVersion = (& $sevenzip | Select-Object -Skip 1 -First 1).Trim()
          "UNRAR_VERSION=$unrar" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SEVENZIP_VERSION=$sevenzipVersion" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # WiX 3's tools run from where they are unpacked; nothing has to
      # be installed.  WiX 3 has had its last release, 3.14.1.
      - name: Fetch WiX 3
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP 'wix3'
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath $wix
          Remove-Item wix.zip
          $wix | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build dist/MComix and the zip
        run: python win32/build_pyinstaller.py
      - name: Build the MSI installer
        run: |
          python win32/build_msi.py
          test -f "dist/mcomix-win64-$VERSION.msi"
          test -f "dist/mcomix-win64-$VERSION.zip"
      # What the frozen build has got wrong before: its PDF workers, which
      # are MComix started again, and the on-screen display, which draws
      # with cairo; and the icon theme and GTK's translations, which
      # PyInstaller left out.
      - name: A PDF to open
        run: |
          python -c "
          import pymupdf, sys
          book = pymupdf.open()
          for number in (1, 2):
              book.new_page().insert_text((72, 72), 'Page %d' % number, fontsize=48)
          book.save(sys.argv[1])
          " "$RUNNER_TEMP/smoke.pdf"
      - name: Start the built MComix
        shell: pwsh
        env:
          # Its settings, library and thumbnails, away from the runner's.
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          $bundle = Resolve-Path dist/MComix
          foreach ($path in 'MComix.exe', 'UnRAR64.dll', '7z.exe', 'JxrDecApp.exe',
                            '_internal/share/icons/Adwaita/index.theme',
                            '_internal/share/locale/de/LC_MESSAGES/gtk40.mo',
                            '_internal/cairo') {
            if (-not (Test-Path (Join-Path $bundle $path))) { throw "The bundle has no $path" }
          }
          foreach ($path in 'mutool.exe', 'MComix.Console.exe') {
            if (Test-Path (Join-Path $bundle $path)) { throw "The bundle carries $path again" }
          }
          # What each run has written so far, read while it runs.
          function Read-Run($files) {
            (@($files) | Where-Object { Test-Path $_ } | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
          }
          # Each run is watched until the line that says it got where it
          # should, or a traceback, for a minute at most; then a few
          # seconds more, for the frame the on-screen display is drawn in
          # and anything that goes wrong after.  A fixed twenty seconds
          # each was both too long and, for a slow start, too short.
          $failed = $false
          foreach ($run in @(
              @{ Name = 'pdf'; Book = "$env:RUNNER_TEMP\smoke.pdf"; Expect = 'Page 1 is available'; Until = 'Page 1 is available' },
              @{ Name = 'missing'; Book = "$env:RUNNER_TEMP\not-there.cbz"; Expect = $null; Until = 'Showing the main window' })) {
            $out = Join-Path $env:RUNNER_TEMP "$($run.Name).out"
            $err = Join-Path $env:RUNNER_TEMP "$($run.Name).err"
            $log = Join-Path $env:RUNNER_TEMP "$($run.Name).log"
            Start-Process (Join-Path $bundle 'MComix.exe') -ArgumentList '-W', 'debug', '-o', $log, $run.Book `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and (Read-Run $out, $err, $log) -notmatch "$($run.Until)|Traceback") {
              Start-Sleep -Milliseconds 500
            }
            Start-Sleep -Seconds 5
            Get-Process -Name 'MComix*' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            $text = Read-Run $out, $err, $log
            Write-Output "::group::$($run.Name)"
            Write-Output $text
            Write-Output '::endgroup::'
            foreach ($bad in 'Traceback', 'unrecognized arguments') {
              if ($text -match $bad) { Write-Output "::error::$($run.Name): $bad"; $failed = $true }
            }
            if ($run.Expect -and $text -notmatch $run.Expect) {
              Write-Output "::error::$($run.Name): no '$($run.Expect)'"; $failed = $true
            }
          }
          if ($failed) { exit 1 }
      # The installer as a user meets it: run over the newest published
      # release's, which it has to replace - up to 26.10 every installer
      # had the same product code, and the next one refused to run over
      # it - then the installed MComix started, then uninstalled.  A test
      # build of the version already released replaces it as a release
      # moved to a new commit does.
      - name: Install over the last release, start it, uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'msi'
          New-Item -ItemType Directory -Force $logs | Out-Null
          function Invoke-Msi([string[]]$arguments, [string]$log) {
            $all = $arguments + @('/qn', '/norestart', '/l*v', (Join-Path $logs $log))
            $code = (Start-Process msiexec.exe -ArgumentList $all -Wait -PassThru).ExitCode
            if ($code -notin 0, 3010) { throw "msiexec $($arguments -join ' ') ended with $code; see the msi artifact" }
          }
          # Every MComix in Programs and Features, for everyone and for this user.
          function Get-Installed {
            @('HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*') |
              ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } |
              Where-Object { $_.DisplayName -eq 'MComix' }
          }
          $previous = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -eq 0 -and $previous) {
            gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern "mcomix-win64-$previous.msi" --dir $logs
          }
          if ($LASTEXITCODE -eq 0 -and $previous) {
            Invoke-Msi @('/i', (Join-Path $logs "mcomix-win64-$previous.msi")) 'previous.log'
            Write-Output "Installed MComix ${previous}: $((Get-Installed).DisplayVersion)"
          } else {
            Write-Output '::notice::No published installer to install over.'
            # The runner ends the step with the last exit code a program left.
            $global:LASTEXITCODE = 0
          }
          Invoke-Msi @('/i', (Resolve-Path "dist/mcomix-win64-$env:VERSION.msi")) 'install.log'
          $installed = @(Get-Installed)
          if ($installed.Count -ne 1) { throw "$($installed.Count) MComix in Programs and Features after the install" }
          Write-Output "Installed $($installed[0].DisplayVersion) at $($installed[0].InstallLocation)"
          $exe = Join-Path $env:ProgramFiles 'MComix\MComix.exe'
          if (-not (Test-Path $exe)) { throw "No $exe" }
          if (-not (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\.cbz\OpenWithProgids' -Name 'MComix.Book' -ErrorAction SilentlyContinue)) {
            throw 'MComix is not offered for .cbz files'
          }
          $log = Join-Path $logs 'installed.log'
          Start-Process $exe -ArgumentList '-W', 'debug', '-o', $log, "$env:RUNNER_TEMP\smoke.pdf"
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $log) -and (Get-Content $log -Raw) -match 'Page 1 is available|Traceback')) {
            Start-Sleep -Milliseconds 500
          }
          Get-Process -Name 'MComix*' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($text -notmatch 'Page 1 is available' -or $text -match 'Traceback') {
            Write-Output $text
            throw 'The installed MComix did not show the PDF'
          }
          Invoke-Msi @('/x', (Resolve-Path "dist/mcomix-win64-$env:VERSION.msi")) 'uninstall.log'
          if (@(Get-Installed).Count -ne 0) { throw 'MComix is still installed after the uninstall' }
          if (Test-Path $exe) { throw "$exe is still there after the uninstall" }
          if (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\.cbz\OpenWithProgids' -Name 'MComix.Book' -ErrorAction SilentlyContinue) {
            throw 'MComix is still offered for .cbz files after the uninstall'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi/*.log
          retention-days: 14
      - name: Say what was built
        run: |
          {
            echo "### MComix $VERSION for Windows"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for file in dist/mcomix-win64-*; do
              echo "| $(basename "$file") | $(du -h "$file" | cut -f1) |"
            done
            echo
            echo "Carrying UnRAR.dll $UNRAR_VERSION, $SEVENZIP_VERSION, and from MSYS2:"
            echo
            pacman -Q mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita \
              mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-gobject \
              mingw-w64-ucrt-x86_64-python-pillow mingw-w64-ucrt-x86_64-python-pymupdf \
              mingw-w64-ucrt-x86_64-pyinstaller mingw-w64-ucrt-x86_64-jxrlib | sed 's/^mingw-w64-ucrt-x86_64-/- /'
            echo
            python -c "import json, sys; print(len(json.load(open(sys.argv[1]))['packages']), 'packages in', sys.argv[1])" \
              "dist/sbom-win64-$VERSION.spdx.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/mcomix-win64-*.zip
            dist/mcomix-win64-*.msi
            dist/sbom-win64-*.spdx.json
          if-no-files-found: error
          retention-days: ${{ needs.setup.outputs.release == 'true' && 30 || 14 }}

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: setup
    # Each architecture on a runner of its own: GitHub's ARM runners are
    # free for public repositories, where emulating aarch64 under QEMU
    # would take hours.  The x86_64 bundle keeps the name it has always
    # had; a failed one leaves the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            suffix: ""
          - arch: aarch64
            runner: ubuntu-24.04-arm
            suffix: "-aarch64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # GNOME 51's Platform and Sdk with flatpak-builder and Flathub's
    # linter, for amd64 and arm64: ghcr.io/flathub-infra/
    # flatpak-github-actions:gnome-51, pinned by digest as the actions
    # are by commit, since it runs privileged and builds a release file.
    # Move it with the runtime-version of the manifest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uploads the bundle as the run's artifact itself.  flatpak-builder's
      # state is cached under the action's own key, the architecture and
      # the manifest's hash, and an older one is restored where the
      # manifest changed; a key of the commit never matched the prefix it
      # restores by, so each build started afresh and left 130 MB behind.
      # A release builds without the cache, from nothing a test build
      # left.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/io.github.twwn.mcomix.yml
          bundle: mcomix-${{ needs.setup.outputs.version }}${{ matrix.suffix }}.flatpak
          arch: ${{ matrix.arch }}
          cache: ${{ github.ref_type != 'tag' }}
      # What Flathub's linter says of the manifest and of the built
      # repository, for the submission to Flathub: in the run's summary,
      # never failing the build, since some of its rules are Flathub's
      # alone (an app not on Flathub has none of its exceptions).
      - name: What Flathub's linter says
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: |
          lint=$(command -v flatpak-builder-lint || echo /app/bin/flatpak-builder-lint)
          {
            echo "### flatpak-builder-lint"
            for what in "manifest flatpak/io.github.twwn.mcomix.yml" "repo repo"; do
              echo
              echo "\`$what\`:"
              echo
              echo '```json'
              # shellcheck disable=SC2086 # the kind and the path, two words
              "$lint" $what 2>&1 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the GitHub release
    needs: [setup, source, windows, flatpak]
    # Without the Flatpak, but never without the source archive and the
    # Windows packages.
    if: >-
      always() && needs.setup.outputs.release == 'true'
      && needs.source.result == 'success'
      && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Gather the files and their checksums
        run: |
          mkdir release
          mv artifacts/source/*.tar.xz artifacts/windows/* release/
          find artifacts -type f -name 'mcomix-*.flatpak' -exec mv -t release/ {} +
          if ! ls release/*.flatpak > /dev/null 2>&1; then
            echo "::warning::The Flatpak did not build; the release goes out without it."
          fi
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
      # Anyone can check with "gh attestation verify <file> --repo <this
      # repository>" that a file was built here, from this tag.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: "release/mcomix-*"
      # And what the Windows packages carry: win32/build_pyinstaller.py
      # writes an SPDX document of the MSYS2 packages whose files are in
      # the bundle, UnRAR.dll and 7-Zip, which goes out beside them and
      # is attested as the SBOM of both ("gh attestation verify <file>
      # --repo <this repository> --predicate-type https://spdx.dev/Document/v2.3").
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        id: sbom
        with:
          subject-path: "release/mcomix-win64-*"
          sbom-path: release/sbom-win64-${{ env.TAG }}.spdx.json
      # Both attestations go out with the release as Sigstore bundles too,
      # so that a file can be checked without asking GitHub for its
      # attestation ("gh attestation verify <file> --repo <this
      # repository> --bundle mcomix-<version>.sigstore.json"), and so
      # that the release says it is signed to those who look for a
      # signature beside its files, as OpenSSF Scorecard does.
      - name: The attestations, as files of the release
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_ATTESTATION: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "release/mcomix-$TAG.sigstore.json"
          cp "$SBOM_ATTESTATION" "release/sbom-win64-$TAG.sigstore.json"
      - name: Publish the release, in place of a draft of it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                       --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::MComix $TAG is published already. To release the tag again, delete that release by hand, keeping the tag, and run this workflow again."
              exit 1
            fi
            # The release alone: the tag it was drafted from stays.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "MComix $TAG" \
            --notes-file artifacts/notes/notes.md release/*
          echo "Published [MComix $TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"

  # A release published with the workflow's own token starts no other
  # workflow, so the package managers are called from here, handed the
  # two secrets they use and no others.
  publish:
    name: Put it out
    needs: [setup, release]
    # A failed Flatpak, upstream of the release, would skip this too.
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.setup.outputs.version }}
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  # PyPI checks this job's OpenID Connect token against the trusted
  # publisher set up for the project: this file, the environment pypi.
  # No secret is stored anywhere, and PyPI takes nothing from a
  # reusable workflow, so the job is here rather than in publish.yml.
  # The repository variable PYPI_PUBLISH turns it on once PyPI is set
  # up.  PyPI never takes a file twice: a release made again from a
  # moved tag fails here, and PyPI keeps the files it has.
  pypi:
    name: Publish on PyPI
    needs: [setup, release]
    if: >-
      always() && needs.release.result == 'success'
      && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcomix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: dist
      # It publishes: like every action here it runs the commit it is
      # pinned to, which only a pull request of Dependabot's moves.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
