name: Tests

# On main, on pull requests, and every Monday: the gates install the
# newest of everything they do not pin, so a week in which something
# moved under the suite shows as a failed Monday run.  A tag is a commit
# main has already tested.
#
# The tests read nearly every file in the repository - the workflows,
# the packaging, the manual.  A change to the icon's artwork source
# alone touches none of it, and a change to the manual alone touches
# only what docs.yml runs: test/test_wiki.py and test/test_keybindings.py,
# on one Python, in a minute rather than three jobs of four.

on:
  push:
    branches: [main]
    paths-ignore:
      - "artwork/**"
      - "docs/**"
      - "*.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "artwork/**"
      - "docs/**"
      - "*.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash runs with -o pipefail, which the runner's default
# bash -e leaves out: a failed command at the head of a pipe went
# unnoticed when what it fed succeeded.
defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The newest Ubuntu's own GTK 4, with PyGObject and pycairo built by
    # pip against it, so that each Python in the matrix gets bindings of
    # its own.  Named, not ubuntu-latest: that label lags a release
    # behind, and the floors job below already has Ubuntu 24.04's GTK
    # 4.14; 26.04 has GTK 4.22 and libadwaita 1.9.
    runs-on: ubuntu-26.04
    # A few minutes a run; a suite that hangs, as it does when a test
    # leaves a worker thread running, ends here and not after GitHub's
    # six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Python pyproject.toml's classifiers name, from the floor
        # requires-python sets, and the newest release, which "3.x" is
        # and which moves on its own: when it became 3.15, no job was
        # left on 3.13 or 3.14.
        python-version: ["3.12", "3.13", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # librsvg2-common is gdk-pixbuf's SVG loader and adwaita-icon-theme
      # the icons as files, which a desktop has and this install did not
      # bring: without them the picture for a page that would not load
      # was the theme's square icon, and a finished book's cover had no
      # tick.  gir1.2-gly-2 and gir1.2-glygtk4-2 let Python reach
      # glycin, which gdk-pixbuf decodes through here; without them the
      # tests of animations read through glycin were skipped.
      # djvulibre-bin holds ddjvu and djvused, which read a DjVu book,
      # and c44 and djvm, which its tests write one with; libjxr-tools
      # holds JxrDecApp, which decodes a KFX book's JPEG XR pictures,
      # and JxrEncApp, which its tests write them with.  unrar,
      # libunrar5t64 and rar (multiverse) and lhasa, whose lha is the
      # name MComix looks for, are what the RAR and LHA tests read and
      # write with: without them 528 of those tests were skipped.
      # appstream and desktop-file-utils validate the metainfo and the
      # desktop entry as distributions and Flathub do; here alone, not
      # under the floors, since the checkers' age is not a floor.
      - name: Install GTK 4 and the tools the tests call
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgirepository-2.0-dev \
            gir1.2-gly-2 gir1.2-glygtk4-2 \
            libcairo2-dev pkg-config xvfb xauth gettext \
            7zip unzip mupdf-tools djvulibre-bin libjxr-tools \
            unrar libunrar5t64 rar lhasa \
            librsvg2-common adwaita-icon-theme \
            appstream desktop-file-utils
      - name: Install MComix and its development dependencies
        run: python -m pip install -e '.[dev,fileformats]' mypy flake8
      - name: pyflakes
        run: python -m flake8 --select=F mcomix/ test/
      - name: mypy
        run: python -m mypy mcomix
      # -rs lists why each skipped test was skipped: with -q alone a run
      # said only how many, and a tool missing from the runner skipped
      # hundreds of tests unseen.  The JUnit report has each skip's and
      # failure's message, which the log has as counts.
      - name: pytest
        run: xvfb-run -a python -m pytest test/ -q -n auto -rs --junitxml=pytest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.xml
          retention-days: 14

  floors:
    # The lowest versions pyproject.toml declares, built with pip against
    # Ubuntu's GTK 4.  PyGObject 3.46 still builds against
    # gobject-introspection 1.0, hence libgirepository1.0-dev - and
    # Ubuntu 24.04, pinned, whose GTK 4.14 is also the oldest the suite
    # runs on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # librsvg2-common is gdk-pixbuf's SVG loader and adwaita-icon-theme
      # the icons as files, which a desktop has and this install did not
      # bring: without them the picture for a page that would not load
      # was the theme's square icon, and a finished book's cover had no
      # tick.  The RAR and LHA tools as in the gates.
      - name: Install GTK 4 and the tools the tests call
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgirepository1.0-dev \
            libcairo2-dev pkg-config xvfb xauth gettext \
            7zip unzip mupdf-tools djvulibre-bin libjxr-tools \
            unrar libunrar5t64 rar lhasa \
            librsvg2-common adwaita-icon-theme
      # Each lower bound in pyproject.toml, made the version to install.
      - name: Install the dependency floors and MComix
        run: |
          python - > floors.txt <<'EOF'
          import tomllib
          with open('pyproject.toml', 'rb') as fp:
              project = tomllib.load(fp)['project']
          for requirement in (project['dependencies']
                              + project['optional-dependencies']['fileformats']):
              print(requirement.replace('>=', '=='))
          EOF
          cat floors.txt
          python -m pip install -r floors.txt pytest pytest-xdist
          python -m pip install --no-deps -e .
      - name: pytest
        run: xvfb-run -a python -m pytest test/ -q -n auto -rs --junitxml=pytest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-floors
          path: pytest.xml
          retention-days: 14
