name: Tests

# On main, on pull requests, and every Monday: the gates install the
# newest of everything they do not pin, so a week in which something
# moved under the suite shows as a failed Monday run.  A tag is a commit
# main has already tested.
#
# The tests read nearly every file in the repository - the manual, the
# workflows, the packaging - so the one thing a change can touch without
# them is the icon's artwork source.

on:
  push:
    branches: [main]
    paths-ignore: ["artwork/**"]
  pull_request:
    paths-ignore: ["artwork/**"]
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The newest Ubuntu's own GTK 4, with PyGObject and pycairo built by
    # pip against it, so that each Python in the matrix gets bindings of
    # its own.  Named, not ubuntu-latest: that label lags a release
    # behind, and the floors job below already has Ubuntu 24.04's GTK
    # 4.14; 26.04 has GTK 4.22 and libadwaita 1.9.
    runs-on: ubuntu-26.04
    # A few minutes a run; a suite that hangs, as it does when a test
    # leaves a worker thread running, ends here and not after GitHub's
    # six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor requires-python sets, and the newest release.
        python-version: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # librsvg2-common is gdk-pixbuf's SVG loader and adwaita-icon-theme
      # the icons as files, which a desktop has and this install did not
      # bring: without them the picture for a page that would not load
      # was the theme's square icon, and a finished book's cover had no
      # tick.  gir1.2-gly-2 and gir1.2-glygtk4-2 let Python reach
      # glycin, which gdk-pixbuf decodes through here; without them the
      # tests of animations read through glycin were skipped.
      # djvulibre-bin holds ddjvu and djvused, which read a DjVu book,
      # and c44 and djvm, which its tests write one with.
      - name: Install GTK 4 and the tools the tests call
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgirepository-2.0-dev \
            gir1.2-gly-2 gir1.2-glygtk4-2 \
            libcairo2-dev pkg-config xvfb xauth gettext \
            7zip unzip mupdf-tools djvulibre-bin \
            librsvg2-common adwaita-icon-theme
      - name: Install MComix and its development dependencies
        run: python -m pip install -e '.[dev,fileformats]' mypy flake8
      - name: pyflakes
        run: python -m flake8 --select=F mcomix/ test/
      - name: mypy
        run: python -m mypy mcomix
      - name: pytest
        run: xvfb-run -a python -m pytest test/ -q -n auto

  floors:
    # The lowest versions pyproject.toml declares, built with pip against
    # Ubuntu's GTK 4.  PyGObject 3.46 still builds against
    # gobject-introspection 1.0, hence libgirepository1.0-dev - and
    # Ubuntu 24.04, pinned, whose GTK 4.14 is also the oldest the suite
    # runs on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # librsvg2-common is gdk-pixbuf's SVG loader and adwaita-icon-theme
      # the icons as files, which a desktop has and this install did not
      # bring: without them the picture for a page that would not load
      # was the theme's square icon, and a finished book's cover had no
      # tick.
      - name: Install GTK 4 and the tools the tests call
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgirepository1.0-dev \
            libcairo2-dev pkg-config xvfb xauth gettext \
            7zip unzip mupdf-tools djvulibre-bin \
            librsvg2-common adwaita-icon-theme
      # Each lower bound in pyproject.toml, made the version to install.
      - name: Install the dependency floors and MComix
        run: |
          python - > floors.txt <<'EOF'
          import tomllib
          with open('pyproject.toml', 'rb') as fp:
              project = tomllib.load(fp)['project']
          for requirement in (project['dependencies']
                              + project['optional-dependencies']['fileformats']):
              print(requirement.replace('>=', '=='))
          EOF
          cat floors.txt
          python -m pip install -r floors.txt pytest pytest-xdist
          python -m pip install --no-deps -e .
      - name: pytest
        run: xvfb-run -a python -m pytest test/ -q -n auto
