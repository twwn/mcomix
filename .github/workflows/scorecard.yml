name: Scorecard

# OpenSSF Scorecard: how the repository fares against the supply-chain
# checks the Open Source Security Foundation keeps - actions pinned,
# tokens read-only, dependencies kept current, releases signed or
# attested, code scanned.  Its findings show under the Security tab
# beside CodeQL's, and the result it publishes to scorecard.dev backs
# the badge in README.md.  Every Monday, on a push to main that changes
# .github/, where most of what it checks lives, and by hand.
#
# Publishing holds the workflow to Scorecard's rules: no env or defaults
# at the top or in the job, no write permission at the top, id-token
# for this job alone, and no step but checkout, upload-artifact,
# CodeQL's upload-sarif and Scorecard's own.

on:
  push:
    branches: [main]
    paths: [".github/**"]
  branch_protection_rule:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The findings, to code scanning.
      security-events: write
      # The token Scorecard proves the result came from this workflow by,
      # when it publishes it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
