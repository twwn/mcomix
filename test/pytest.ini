[pytest]
addopts = -r sFEX
# PyGObject's gi/events.py reads asyncio's event loop policy inside
# warnings.catch_warnings() to keep the warnings Python 3.14 raises about
# it quiet, but never tells catch_warnings() to ignore them: every
# GLib.MainContext.iteration() from Python warns.  That was 39516 of the
# suite's 39581 warnings.  Only from gi.events, so the same call from
# MComix would still be heard.
filterwarnings =
    ignore:'asyncio\.(AbstractEventLoopPolicy|get_event_loop_policy)' is deprecated:DeprecationWarning:gi\.events
# A deprecation MComix' own code reaches fails the test that reaches it,
# so that a Python, GTK or library release deprecating something the
# code calls shows as a failed run on the CI's newest versions, not as
# a line among a thousand in a summary nobody reads.  Then the ones
# kept on purpose (the finished Deprecations campaign): Gtk.FileChooser,
# which MComix embeds where Gtk.FileDialog would only open a window of
# its own, and GdkPixbuf's animations, the last decoder of an animated
# page where neither Pillow nor glycin reads it, are still listed in
# the summary.  Later lines win.
    error::DeprecationWarning:mcomix
    default:Gtk\.FileChooser\.:DeprecationWarning
    default:GdkPixbuf\.PixbufAnimation:DeprecationWarning
