[pytest]
addopts = -r sFEX
# PyGObject's gi/events.py reads asyncio's event loop policy inside
# warnings.catch_warnings() to keep the warnings Python 3.14 raises about
# it quiet, but never tells catch_warnings() to ignore them: every
# GLib.MainContext.iteration() from Python warns.  That was 39516 of the
# suite's 39581 warnings.  Only from gi.events, so the same call from
# MComix would still be heard.
filterwarnings =
    ignore:'asyncio\.(AbstractEventLoopPolicy|get_event_loop_policy)' is deprecated:DeprecationWarning:gi\.events
