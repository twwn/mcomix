[project]
name = "mcomix"
dynamic = ["version"]
description = "GTK comic book viewer"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
# SPDX expression, matching the "or (at your option) any later version"
# grant in the source headers and share/metainfo/mcomix.metainfo.xml.
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
authors = [{name = "Pontus Ekberg"}]
maintainers = [{name = "The MComix Team"}]
keywords = ["comix", "comics", "manga", "images", "reader", "image viewer", "cbr", "cbz"]
classifiers = [
  "Development Status :: 6 - Mature",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX :: BSD",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: Viewers"
]
dependencies = [
  # Lower bounds are the first releases supporting the minimum Python above.
  "PyGObject>=3.46.0",
  "pycairo>=1.25.0",
  "Pillow>=10.1.0",
]

[project.optional-dependencies]
fileformats = [
  "chardet",
  # Keep in step with PYMUPDF_VERSION_REQUIRED in mcomix/archive/pdf_multi.py,
  # which is what actually decides whether the native PDF handler loads;
  # test/test_pdf_multi.py checks that the two agree.
  "PyMuPDF>=1.23.5"
]
dev = [
  # For running tests
  "pytest",
  # For building Windows package
  "pyinstaller; os_name == 'nt'",
  # For creating source package
  "build",
  # For updating virtual environment
  "pip-review",
  # For language server/IDE
  "python-lsp-server[flake8]",
  "pylsp-mypy",
  "pyls-isort",
  "python-lsp-black",
  # For mypy
  "types-Pillow",
  "pygobject-stubs"
]

[project.urls]
Homepage = "https://mcomix.sourceforge.io"
Documentation = "https://sourceforge.net/projects/mcomix/Wiki/Home/"
Repository = "https://sourceforge.net/p/mcomix/git/ci/master/tree/"
Changelog = "https://sourceforge.net/p/mcomix/news/"

[project.scripts]
mcomix = "mcomix.__main__:main"

[build-system]
# 77.0.0 is the first release accepting an SPDX expression in project.license.
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcomix*"]

[tool.setuptools.dynamic]
version = {attr = "mcomix.constants.VERSION"}

[tool.mypy]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
