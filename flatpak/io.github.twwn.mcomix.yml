# The Flatpak of this fork.  Its id is io.github.twwn.mcomix: Flathub's
# net.sourceforge.mcomix is the original MComix 3, and the name it shows
# stays MComix.  This copy builds the tree it sits in; the copy for
# Flathub, which builds a release tag, is written from it by
# flatpak/flathub_manifest.py.
#
#   flatpak-builder --user --install-deps-from=flathub --install --force-clean build-dir flatpak/io.github.twwn.mcomix.yml
#   flatpak run io.github.twwn.mcomix

app-id: io.github.twwn.mcomix
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: mcomix
rename-icon: mcomix
rename-desktop-file: mcomix.desktop
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --env=TMPDIR=/var/tmp
  # MComix embeds its own file chooser rather than asking the portal for
  # one, so the places books are kept have to be open to it.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-desktop
  - --filesystem=/media
  - --filesystem=/run/media

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
  - /share/man

modules:
  # 7z files, and ZIP, LHA, xz and lzma files Python cannot read.
  - name: 7-zip
    buildsystem: simple
    build-commands:
      # Without -Werror: a newer GCC than 7-Zip's own warns where it did
      # not, and the build stopped there.
      - make -C CPP/7zip/Bundles/Alone2 -j ${FLATPAK_BUILDER_N_JOBS} -f ../../cmpl_gcc.mak
        CFLAGS_WARN_WALL="-Wall -Wextra"
      - install -Dm755 CPP/7zip/Bundles/Alone2/b/g/7zz ${FLATPAK_DEST}/bin/7z
    sources:
      - type: git
        url: https://github.com/ip7z/7zip.git
        tag: '26.05'
        commit: b88c6bc09339de32f7d18bbab900686b244f42ba
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  # RAR files, through the library and, as a fallback, the program.
  - name: unrar
    buildsystem: simple
    # rar_add.htm, which the checker reads, links RARLAB's newest source,
    # a beta as often as not: unrarsrc-7.3.1 was RAR 7.30 beta 1.  The
    # Windows build takes the newest release below a beta
    # (win32/fetch_unrar.ps1); here a beta stops the build.
    build-commands:
      - test "$(sed -n 's/^#define RARVER_BETA *//p' version.hpp)" = 0
      - make -j ${FLATPAK_BUILDER_N_JOBS} unrar
      - install -Dm755 unrar ${FLATPAK_DEST}/bin/unrar
      - make clean
      - make -j ${FLATPAK_BUILDER_N_JOBS} lib
      - install -Dm755 libunrar.so ${FLATPAK_DEST}/lib/libunrar.so
    sources:
      - type: archive
        url: https://www.rarlab.com/rar/unrarsrc-7.2.7.tar.gz
        sha256: 01d903a7dcf413cb2925696d7796e48e38d471f79bfe7ef3ad2aebf6c12dbefd
        x-checker-data:
          type: html
          url: https://www.rarlab.com/rar_add.htm
          version-pattern: unrarsrc-([\d.]+)\.tar\.gz
          url-template: https://www.rarlab.com/rar/unrarsrc-$version.tar.gz

  # DjVu files: ddjvu and djvused.
  - name: djvulibre
    config-opts:
      - --disable-desktopfiles
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/djvu/DjVuLibre/3.5.30/djvulibre-3.5.30.tar.gz
        sha256: ee5e457d4cfebe566f94b99e5e3d3cc7f5c79ddb741c2ac2ba2e456f00329644
        x-checker-data:
          type: anitya
          project-id: 10159
          stable-only: true
          url-template: https://downloads.sourceforge.net/project/djvu/DjVuLibre/$version/djvulibre-$version.tar.gz

  # The pictures a KFX book keeps in JPEG XR: JxrDecApp, linked against
  # jxrlib's libraries statically.
  - name: jxrlib
    buildsystem: simple
    build-commands:
      - make -j ${FLATPAK_BUILDER_N_JOBS} "$(pwd)/build/JxrDecApp"
      - install -Dm755 build/JxrDecApp ${FLATPAK_DEST}/bin/JxrDecApp
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/jxrlib/LICENSE
    sources:
      - type: git
        url: https://github.com/mircomir/jxrlib.git
        tag: '1.4.4'
        commit: ddda911f389362fc33ba3babf223ce912f3cc909
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  # Pillow's build needs it, and nothing after.
  - name: python3-pybind11
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "pybind11" --no-build-isolation
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/33/fd/8762f7ee3e4e4be6d1d846cffb4916dd9bb02b2f800d3603718a0efe494c/pybind11-3.1.0-py3-none-any.whl
        sha256: b8488090f8acffbcb6b5d6a85571a6827a0a2981ffb75e5a0b27b87c4a6b7dd0
        x-checker-data:
          type: pypi
          name: pybind11
          packagetype: bdist_wheel

  - name: python3-Pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "Pillow" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ce/a4/9cc30690a394a8305e8be4c9036aa16d0dfddadd09079860b582f562496d/pillow-13.0.0.tar.gz
        sha256: cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510
        x-checker-data:
          type: pypi
          name: Pillow

  # Guesses the encoding of names and comments that are not UTF-8.
  - name: python3-chardet
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "chardet" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/cc/75/88a3eb36264375ff951bd2f9397c409727ab6aa6a18e1bd933851571d421/chardet-7.7.0-py3-none-any.whl
        sha256: 11cf9b719ea3675a2a7d8a3071bbe4d7ea24b26bfe39a51588d515ddd05cacad
        x-checker-data:
          type: pypi
          name: chardet
          packagetype: bdist_wheel

  # PDF files.
  - name: python3-PyMuPDF
    buildsystem: simple
    # PyMuPDF 2.0 requires onnxruntime, numpy, networkx, PyYAML, psutil,
    # tabulate, pymupdf-layout and pymupdf4llm, for its layout analysis;
    # the module itself imports none of them, and MComix uses none.
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "PyMuPDF" --no-build-isolation --no-deps
    cleanup:
      - /lib/python*/site-packages/pymupdf/mupdf-devel
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f6/fc/cbdf76a9b9bdacc50e9ef3099cca4c8bb9a369be033abfd0c0097ba4e8ef/pymupdf-2.0-cp311-abi3-manylinux_2_28_x86_64.whl
        sha256: f92e8a7ae92c7b1cbffcbe8764166ab1234e0a37b07549f5951e7739241d34f0
        only-arches:
          - x86_64
      - type: file
        url: https://files.pythonhosted.org/packages/45/4c/79c020bec68b7f70ca7e423fb2969a9dc64a5b5cc7e512bd2281f2ae7719/pymupdf-2.0-cp311-abi3-manylinux_2_28_aarch64.whl
        sha256: c9faff6d6ec5882e934a21893917f2c460bbc79f3645318e1f8d726990ab4580
        only-arches:
          - aarch64

  - name: mcomix
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --no-deps
        --prefix=${FLATPAK_DEST} --no-build-isolation .
      - mkdir -p ${FLATPAK_DEST}/share
      - cp -a share/applications share/icons share/mime -t ${FLATPAK_DEST}/share/
      # Only what is named after the app id leaves the sandbox.
      - mv ${FLATPAK_DEST}/share/mime/packages/mcomix.xml ${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}.xml
      # The component takes the app id here, rather than through
      # rename-appdata-file, which would add net.sourceforge.mcomix, the
      # original MComix, as an id this one provides.
      - install -d ${FLATPAK_DEST}/share/metainfo
      - sed -e "s|<id>net.sourceforge.mcomix</id>|<id>${FLATPAK_ID}</id>|"
        -e "s|>mcomix.desktop</launchable>|>${FLATPAK_ID}.desktop</launchable>|"
        share/metainfo/mcomix.metainfo.xml > ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - build-dir
          - test
          - .claude
          - .git
